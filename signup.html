<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="GlassAuth — a modern, responsive glassmorphism Login & Signup UI built with HTML, CSS and vanilla JavaScript.">

<title>GlassAuth — Signup</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="hero">

    <div class="auth-card">

    <h1>Signup</h1>

    <p>Create your account to get started.</p>

    <form id="signup-form" novalidate>

        <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="username">
            <i class="fa-regular fa-user"></i>
            <span class="error-msg" id="username-error"></span>
        </div>

        <div class="input-box">
            <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email">
            <i class="fa-regular fa-envelope"></i>
            <span class="error-msg" id="email-error"></span>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password">
            <i class="fa-regular fa-eye toggle-password" title="Show / hide password"></i>
            <span class="error-msg" id="password-error"></span>
        </div>

        <!-- Password strength meter -->
        <div class="strength-meter" id="strength-meter">
            <div class="strength-bars">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <span class="strength-text" id="strength-text">Password strength</span>
        </div>

        <div class="input-box">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" autocomplete="new-password">
            <i class="fa-regular fa-eye toggle-password" title="Show / hide password"></i>
            <span class="error-msg" id="confirm-password-error"></span>
        </div>

        <div class="options">
            <label class="remember terms">
                <input type="checkbox" id="terms">
                I agree to the <a href="#" class="inline-link">Terms & Conditions</a>
            </label>
            <span class="error-msg" id="terms-error"></span>
        </div>

        <button type="submit" class="auth-btn">
            Signup
        </button>

    </form>

    <p class="signup-text">
    Already have an account?
    <a href="login.html">Login</a>
</p>

</div>

</section>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>

</html>
