name: Add original background image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-background:
    runs-on: ubuntu-latest
    # Skip when triggered by our own commit (prevents a loop).
    if: "${{ !contains(github.event.head_commit.message, 'chore: add original background image') }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download background photo
        run: |
          curl -fSL -o background.jpg "https://raw.githubusercontent.com/melleeyyy/login-signup-ui/main/background.jpg"

      - name: Commit background photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.jpg
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: add original background image [skip ci]"
            git push
          fi
